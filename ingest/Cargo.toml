[package]
name = "ingest"
version = "0.1.0"
edition = "2021"
description = "Read local project files safely — list, read, grep and ingest a directory as JSON"

[dependencies]
anyhow = "1"
base64 = "0.22"
console = "0.15"
glob = "0.3"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
walkdir = "2"
