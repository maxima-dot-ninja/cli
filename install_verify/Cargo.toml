[package]
name = "install_verify"
version = "0.1.0"
edition = "2021"
description = "Deterministic post-install verification for the vaulty daemon"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"

[profile.release]
strip = true
lto = true
