[package]
name = "phog"
version = "0.1.0"
edition = "2021"
description = "CLI for PostHog — HogQL from the terminal, people and events by fingerprint, dashboards as files"

[dependencies]
anyhow = "1"
vaultykeys = { path = "../vaultykeys" }
clap = { version = "4", features = ["derive"] }
console = "0.15"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
