[package]
name = "mension"
version = "0.1.0"
edition = "2021"
description = "Eliot's side of artefact comments — list the threads waiting on him and reply, through the api's machine-token routes"

[dependencies]
anyhow = "1"
vaultykeys = { path = "../vaultykeys" }
console = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = { version = "1", features = ["preserve_order"] }
