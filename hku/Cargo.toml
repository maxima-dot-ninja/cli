[package]
name = "hku"
version = "0.1.0"
edition = "2021"
description = "CLI for Heroku — apps, dynos, config vars, releases and logs from the terminal"

[dependencies]
anyhow = "1"
vaultykeys = { path = "../vaultykeys" }
clap = { version = "4", features = ["derive"] }
console = "0.15"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
