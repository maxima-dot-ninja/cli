[package]
name = "waspy"
version = "0.1.0"
edition = "2021"
description = "WhatsApp Spy: read your WhatsApp from the terminal, straight out of the desktop app's own database. Read-only."

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
console = "0.15"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
dirs = "5"
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
