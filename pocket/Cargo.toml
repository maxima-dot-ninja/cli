[package]
name = "pocket"
version = "0.1.0"
edition = "2021"
description = "CLI for Pocket AI — export recorded conversations and search them in natural language"

[dependencies]
anyhow = "1"
vaultykeys = { path = "../vaultykeys" }
console = "0.15"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
unicode-normalization = "0.1"
